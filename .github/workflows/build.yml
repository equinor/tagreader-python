name: "🧪 Build & test code"

permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
        os: [windows-latest, ubuntu-latest, macos-latest]
        exclude:
          - python-version: "3.9"
            os: ubuntu-latest
        include:
          - python-version: "3.9"
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    env:
      # macOS system Python 3.9 is linked against LibreSSL, which urllib3 v2 warns about.
      UV_MANAGED_PYTHON: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install required Linux library for pykerberos
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          sudo apt-get update && sudo apt-get install libkrb5-dev

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install deps
        run: uv sync --locked

      - name: Check Python TLS backend
        run: uv run --locked python -c "import ssl, sys; print(sys.version); print(ssl.OPENSSL_VERSION); sys.exit('LibreSSL' in ssl.OPENSSL_VERSION)"

      - name: Run tests
        run: uv run --locked pytest
