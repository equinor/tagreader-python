[project]
name = "tagreader"
version = "6.3.1"
description = "Tagreader is a Python package for reading trend data from the OSIsoft PI and Aspen Infoplus.21 IMS systems."
authors = [
    { name = "Einar S. Idsø", email = "eiids@equinor.com" },
    { name = "Morten Dæhli Aslesen", email = "masl@equinor.com" },
]
maintainers = [
    { name = "Åsmund Våge Fannemel", email = "asmf@equinor.com" },
]
requires-python = ">=3.9.6,<4.0.0"
readme = "README.md"
license = "MIT"
keywords = [
    "Aspen InfoPlus.21",
    "OSIsoft PI",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "pandas>=1.4.0,<4",
    "certifi>=2026.10.23,<2027.0.0",
    "requests>=2.32.5",
    "requests-kerberos>=0",
    "msal-bearer>=1.6.0",
    "diskcache>=5.6.1",
    "pycryptodome>=4.1.0",
    "requests-ntlm>=1.1,<=2.0",
    "platformdirs>=4.4.0",
    "urllib3>=2.5.0", # To avoid security issue https://www.cve.org/CVERecord?id=CVE-2025-50182
    "playwright (>=1.59.0,<2.0.0)",
    "browser-cookie3 (>=0.20.1,<0.21.0)"
]

[project.urls]
homepage = "https://github.com/equinor/tagreader-python"
repository = "https://github.com/equinor/tagreader-python"

[dependency-groups]
dev = ["pre-commit>=3.0", "pytest>=7,<9"]

[tool.uv]
default-groups = "all"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
