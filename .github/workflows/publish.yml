name: 🚀 Upload Python Package

permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_call:

jobs:
  deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install Poetry
        run: |
          pipx install poetry

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install deps
        run: uv sync --locked

      - name: Build distributions
        run: uv build

      - name: Publish to PyPI
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_TOKEN }}
        run: |
          poetry publish
